<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="공부·일기 블로그"><title>Private | memo pad</title><style>/*
 * 모바일 레이아웃. 이 파일 전체가 아래 @media 안에 들어간다.
 * 브레이크포인트 값은 src/config/site.ts의 MOBILE_BREAKPOINT에서 빌드 시 채워진다(BaseLayout 참고).
 * global.css·prose.css는 base 레이어에 있고, 이 파일은 그보다 뒤인 mobile 레이어라서 항상 우선한다.
 */
@layer base, mobile;

@layer mobile {
  @media (max-width: 768px) {
    .pad {
      --margin-width: var(--margin-width-mobile);
      grid-template-columns: minmax(0, 1fr);
      padding-left: var(--margin-width);
    }

    .pad-content {
      padding-left: var(--space-2);
      padding-right: var(--space-2);
    }

    /* 좌측 여백 메뉴 → 왼쪽에서 밀려 나오는 드로어 */
    .side-menu {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      align-self: normal;
      z-index: 30;
      width: min(var(--drawer-width), 85vw);
      max-height: none;
      background-color: var(--color-paper);
      background-image: linear-gradient(
        to bottom,
        transparent calc(var(--line-height-rule) - 1px),
        var(--color-rule) calc(var(--line-height-rule) - 1px)
      );
      background-size: 100% var(--line-height-rule);
      background-position: 0 var(--rule-offset);
      box-shadow: 2px 0 8px rgba(0, 0, 0, 0.2);
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      visibility: hidden;
    }

    .side-menu.is-open,
    .side-menu.is-dragging {
      visibility: visible;
    }

    .side-menu.is-open {
      transform: translateX(0);
    }

    .side-menu.is-dragging {
      transition: none;
    }

    .drawer-backdrop {
      display: block;
      position: fixed;
      inset: 0;
      z-index: 20;
      background: var(--color-backdrop);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .drawer-backdrop.is-visible {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer-backdrop.is-dragging {
      transition: none;
    }

    /* 드로어가 열린 동안 배경 스크롤 잠금 */
    html.drawer-locked,
    html.drawer-locked body {
      overflow: hidden;
      overscroll-behavior: none;
    }

    /* 에디터 미리보기: 화면 전체, 안쪽 여백은 모바일 글 화면과 같게 */
    .pe-preview {
      width: 100%;
      height: 100%;
      margin: 0;
      border: 0;
    }

    .pe-preview-page {
      padding-left: calc(var(--margin-width-mobile) + var(--space-2));
      padding-right: var(--space-2);
    }

    /* 스티커: 모바일에서는 레이어와 스티커 모드를 모두 숨긴다. */
    .sticker-layer,
    .sticker-toolbar,
    .sticker-mode-button {
      display: none !important;
    }
  }
}
